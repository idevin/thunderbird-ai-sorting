<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>__MSG_composeTitle__</title>
    <link rel="stylesheet" href="../ui.css" />
    <link rel="stylesheet" href="compose.css" />
  </head>
  <body class="popup">
    <main>
      <h1>__MSG_composeTitle__</h1>
      <p class="lead">__MSG_composeLead__</p>
      <label class="field" for="instruction">
        <span>__MSG_instruction__</span>
        <textarea id="instruction" rows="4"></textarea>
      </label>
      <div class="row">
        <button id="insert" class="primary" type="button">__MSG_insertDraft__</button>
        <button id="shorter" type="button">__MSG_presetShorter__</button>
        <button id="decline" type="button">__MSG_presetDecline__</button>
      </div>
      <p id="status" role="status"></p>
      <p id="error" class="error" hidden></p>
    </main>
    <script type="module" src="compose.js"></script>
  </body>
</html>
