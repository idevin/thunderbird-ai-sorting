<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Draft with AI</title>
    <link rel="stylesheet" href="../ui.css" />
    <link rel="stylesheet" href="compose.css" />
  </head>
  <body class="popup">
    <main>
      <h1>Draft with AI</h1>
      <p class="lead">Replies and summaries are written in English.</p>
      <label class="field" for="instruction">
        <span>Instructions</span>
        <textarea id="instruction" rows="4"></textarea>
      </label>
      <div class="row">
        <button id="insert" class="primary" type="button">Insert into draft</button>
        <button id="shorter" type="button">Make it shorter</button>
        <button id="decline" type="button">Politely decline</button>
      </div>
      <p id="status" role="status"></p>
      <p id="error" class="error" hidden></p>
    </main>
    <script type="module" src="compose.js"></script>
  </body>
</html>
