<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Answer with AI</title>
    <link rel="stylesheet" href="../ui.css" />
    <link rel="stylesheet" href="compose.css" />
  </head>
  <body class="popup">
    <main>
      <h1>Answer with AI</h1>
      <p class="lead">Replies are written in English.</p>
      <label class="field" for="style">
        <span>Style</span>
        <select id="style">
          <option value="polite">Polite</option>
          <option value="funny">Funny</option>
          <option value="sad">Sad</option>
          <option value="tricky">Tricky</option>
          <option value="angry">Angry</option>
          <option value="philosophic">Philosophic</option>
          <option value="buddha">Buddha</option>
          <option value="formal">Formal</option>
          <option value="warm">Warm</option>
          <option value="brief">Brief</option>
          <option value="dry">Dry</option>
        </select>
      </label>
      <div class="row">
        <button id="answer" class="primary" type="button">Answer</button>
        <button id="decline" type="button">Decline</button>
      </div>
      <p id="status" role="status"></p>
      <p id="error" class="error" hidden></p>
    </main>
    <script type="module" src="compose.js"></script>
  </body>
</html>
