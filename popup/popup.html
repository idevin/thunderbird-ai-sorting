<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Sorting</title>
    <link rel="stylesheet" href="../ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup">
    <main>
      <h1>AI Sorting</h1>
      <p class="lead">Messages from a service move into a folder of that name under the inbox. Mail from a person stays in the inbox. Up to 50 messages on this page are sorted, or the ones you selected.</p>
      <div class="row">
        <button id="sort" class="primary" type="button">Sort messages</button>
        <button id="options" type="button">Settings</button>
      </div>
      <p id="status" role="status"></p>
      <p id="error" class="error" hidden></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
