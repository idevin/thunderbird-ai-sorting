<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Sorting</title>
    <link rel="stylesheet" href="../ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup">
    <main>
      <h1>AI Sorting</h1>
      <p class="lead">If more than one message is selected, those messages are sorted. Otherwise the current page of this folder is sorted, up to 50 messages. Tags appear in the message list and in the quick filter.</p>
      <div class="row">
        <button id="sort" class="primary" type="button">Sort messages</button>
        <button id="options" type="button">Settings</button>
      </div>
      <p id="status" role="status"></p>
      <p id="error" class="error" hidden></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
