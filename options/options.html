<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>__MSG_optionsTitle__</title>
    <link rel="stylesheet" href="../ui.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>__MSG_optionsTitle__</h1>
      <p class="lead">__MSG_optionsLead__</p>

      <label class="field">
        <span>__MSG_optionProvider__</span>
        <select id="provider">
          <option value="openai">ChatGPT</option>
          <option value="openrouter">OpenRouter</option>
          <option value="gemini">Gemini</option>
          <option value="grok">Grok</option>
        </select>
      </label>

      <label class="field">
        <span>__MSG_optionApiKey__</span>
        <input id="api-key" type="password" autocomplete="off" spellcheck="false" />
      </label>

      <label class="field">
        <span>__MSG_optionModel__</span>
        <input id="model" type="text" autocomplete="off" spellcheck="false" />
        <span class="hint">__MSG_optionModelHelp__</span>
      </label>

      <label class="option" for="auto">
        <input id="auto" type="checkbox" />
        <span>
          <span class="option-title">__MSG_optionAutoTitle__</span>
          <span class="option-help">__MSG_optionAutoHelp__</span>
        </span>
      </label>

      <label class="option" for="use-ai">
        <input id="use-ai" type="checkbox" />
        <span>
          <span class="option-title">__MSG_optionAiTitle__</span>
          <span class="option-help">__MSG_optionAiHelp__</span>
        </span>
      </label>

      <p class="hint">__MSG_privacyNote__</p>

      <div class="row">
        <button id="save" class="primary" type="button">__MSG_save__</button>
        <button id="test" type="button">__MSG_test__</button>
      </div>

      <p id="status" role="status"></p>
      <p id="error" class="error" hidden></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
